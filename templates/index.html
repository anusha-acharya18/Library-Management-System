<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f5fa;
            color: #222;
        }

        header {
            background: #172554;
            color: white;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 22px;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h2 {
            font-size: 42px;
            color: #172554;
            margin-bottom: 18px;
        }

        .hero p {
            color: #555;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 13px 28px;
            border-radius: 7px;
            text-decoration: none;
        }

        footer {
            text-align: center;
            padding: 22px;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Library</h1>
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('register') }}">Register</a>
        </nav>
    </header>

    <section class="hero">
        <h2>Welcome to Our Library</h2>
        <p>Discover, explore and manage your books in one place.</p>
        <a href="{{ url_for('login') }}" class="btn">Explore Books</a>
    </section>

    <footer>
        Library Management System
    </footer>

</body>
</html>
